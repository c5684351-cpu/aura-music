# Aura: listens to every new song and fills in genre, moods, tempo and key.
# Runs by itself after each YAYINLA.bat upload. Results: catalog.json + analiz.json.
name: Aura song analysis

on:
  push:
    branches: [main]
    paths: ["catalog.json", "songs/**", ".github/aura/**", ".github/workflows/analiz.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: aura-analysis
  cancel-in-progress: true

jobs:
  analyse:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/aura/requirements.txt

      - name: Cache the music model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: aura-hf-ast-v1

      - name: Install
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install --upgrade pip -q
          pip install -q torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r .github/aura/requirements.txt

      - name: Analyse songs
        run: python .github/aura/analyze.py

      - name: Save results
        run: |
          if git diff --quiet -- catalog.json analiz.json && [ -z "$(git ls-files --others --exclude-standard -- analiz.json)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "Aura analysis"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json analiz.json
          git commit -q -m "Aura: song analysis"
          git pull --rebase -q origin main || { echo "Newer upload arrived; it will be analysed in its own run."; exit 0; }
          git push -q origin HEAD:main
          # Pushes made here do not start a Pages build by themselves, so ask for one.
          curl -s -o /dev/null -w "Pages build request: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
